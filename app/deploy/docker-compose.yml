# Runs on the VPS whose fixed outgoing IP is registered with AppLink.
# Database: Supabase Postgres (DATABASE_URL in .env.production), not a container here.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    expose: ["3000"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
volumes:
  caddy_data:
